name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Build, Test, Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 저장소에 아직 Python 소스/테스트가 없을 수 있으므로(초기 단계),
      # 없으면 이후 단계를 안전하게 건너뛰고 통과 처리한다.
      - name: Detect Python sources/tests
        id: detect
        run: |
          if git ls-files '*.py' | grep -q .; then
            echo "has_py=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_py=false" >> "$GITHUB_OUTPUT"
          fi
          if git ls-files 'test_*.py' '*_test.py' 'tests/*.py' 'tests/**/*.py' | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.detect.outputs.has_py == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pylint radon coverage

      - name: Build (syntax/compile check)
        if: steps.detect.outputs.has_py == 'true'
        run: python -m compileall -q .

      # 명명 규칙(camelCase, 3글자 이상)은 프로젝트 예외이므로 관련 경고는
      # 아래 flake8 설정(.flake8 또는 --extend-select/--ignore)에서 억제한다.
      # 저장소에 .flake8 설정 파일이 없으면 기본값으로 동작한다.
      - name: Static analysis - flake8
        if: steps.detect.outputs.has_py == 'true'
        run: flake8 --max-line-length=120 .

      - name: Static analysis - duplicate code (pylint, max 7 lines)
        if: steps.detect.outputs.has_py == 'true'
        run: |
          pylint --disable=all --enable=duplicate-code \
            --min-similarity-lines=7 $(git ls-files '*.py')

      - name: Static analysis - cyclomatic complexity (max 10)
        if: steps.detect.outputs.has_py == 'true'
        run: |
          VIOLATIONS=$(radon cc --min C -s .)
          if [ -n "$VIOLATIONS" ]; then
            echo "$VIOLATIONS"
            echo "::error::Cyclomatic complexity exceeds the project limit of 10."
            exit 1
          fi

      # CLAUDE.md 기준: 단위테스트 분기 커버리지 100%, 테스트 성공률 100%.
      # 저장소에 unit/integration 테스트가 분리되어 있지 않은 초기 단계에는
      # 전체 스위트에 대해 적용한다 — src/tests 레이아웃이 정리되면
      # 단위 테스트 디렉터리로 범위를 좁히는 것을 권장한다.
      - name: Run tests with branch coverage
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          coverage run --branch -m unittest discover -v
          coverage report -m
          coverage xml
          coverage report --fail-under=100

      - name: No Python sources yet
        if: steps.detect.outputs.has_py == 'false'
        run: echo "No Python source files found yet - skipping build/static analysis/tests."

      - name: No tests yet
        if: steps.detect.outputs.has_py == 'true' && steps.detect.outputs.has_tests == 'false'
        run: echo "Python sources exist but no tests were found - skipping test execution. Add tests before merging real code."

      - name: Upload coverage report
        if: steps.detect.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
